plugins {
    id 'com.android.application'
}

android {
    namespace 'local.yk.remote'
    compileSdk 35

    defaultConfig {
        applicationId 'local.yk.remote'
        minSdk 30
        targetSdk 35
        versionCode 5
        versionName '2.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
